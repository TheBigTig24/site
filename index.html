<!DOCTYPE html>
<head>
    <title>Caleb Chung</title>
    <meta charset="utf-8">

    <!-- Styles -->
    <link rel="stylesheet" href="styles/index.css"/>
    <link rel="stylesheet" href="styles/navbar.css"/>
    <link rel="stylesheet" href="styles/main_content.css"/>
    <link rel="stylesheet" href="styles/experience.css"/>
    <link rel="stylesheet" href="styles/projects.css"/>
    <link rel="stylesheet" href="styles/contact.css"/>

    <!-- Fonts -->
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Italianno&display=swap');
    </style>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap');
    </style>

    <!-- Scripts -->
    <script src="scripts/index.js"></script>
    <script async src="https://maps.googleapis.com/maps/api/js?key=%%&callback=console.debug&libraries=maps,marker&v=beta">
    </script>
</head>
<body>

    <!-- Navbar -->
    <div id="navbar">
        <p>Caleb Chung</p>
        <div id="tab-list">
            <ul id="unordered_tab_list">
                <li><a href="#experience">EXPERIENCE</a></li>
                <li><a href="#projects">PROJECTS</a></li>
                <li><a href="#travel">TRAVEL</a></li>
                <li><a href="#contact">CONTACT</a></li>
            </ul>
        </div>
    </div>

    <!-- Main Page -->
    <div id="main-content">
        <div id="container">
            <p class="italianno-regular">Welcome to Caleb's website!</p>
            <button id="see-more" onclick="seeMoreScroll()">Click to see more!</button>
        </div>
    </div>

    <!-- Experience Tab -->
     <div id="experience">
        <div id="title-text">
            <p id="title" class="space-grotesk-text">EXPERIENCE</p>
            <p id="description" class="space-grotesk-text">Looking for job in Software Engineering or Web Development</p>
        </div>
        <div id="experience-content">
            <div id="downwards-line"></div>
            <div id="experience-items">

            </div>
        </div>
     </div>

    <!-- Projects Tab -->
    <div id="projects">
        <p id="title-text" class="space-grotesk-text">PROJECTS</p>
        <div id="project-content">
            <div id="project-items">

            </div>
        </div>
    </div>

    <!-- Travel Tab -->
    <div id="travel">
        <gmp-map center="40.12150192260742,-100.45039367675781" zoom="4" map-id="DEMO_MAP_ID">
            <gmp-advanced-marker position="40.12150192260742,-100.45039367675781" title="My location"></gmp-advanced-marker>
        </gmp-map>
    </div>

    <!-- Contact Tab -->
    <div id="contact">
        <div id="socials-container">
            <div style="width: 200px; height: 200px"></div>
            <div id="socials-list"></div>
        </div>
    </div>
</body>
